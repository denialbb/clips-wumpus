name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and Cyclomatic Complexity Check
        run: |
          # Enforce flake8 syntax and undefined-name checks outside generated files
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,.git
          # Radon report covers the simulator, the GUI, the tools and the tests;
          # the per-function grade B limit is enforced by tests/test_complexity.py
          radon cc -s -a -nb wumpus.py gui.py tools/ tests/

      - name: Run test suite
        run: |
          pytest -v tests/
